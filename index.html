<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Công Chúa Của Anh</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050005; /* Nền đen có chút ám hồng vũ trụ */
            font-family: 'Arial', sans-serif;
            touch-action: none; /* Vô hiệu hóa hành vi cuộn mặc định trên điện thoại */
            user-select: none; /* Chống bôi đen text */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        #instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 182, 193, 0.7); /* Màu hồng nhạt */
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            animation: pulse 2s infinite;
            text-align: center;
            width: 100%;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div id="instruction">VUỐT MÀN HÌNH ĐỂ XOAY GÓC NHÌN 3D</div>

    <script>
        const canvas = document.getElementById('canvas');
        // Tắt alpha để tối ưu hiệu suất vẽ nền đen
        const ctx = canvas.getContext('2d', { alpha: false }); 

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Danh sách câu tỏ tình
        const phrases = [
            "I LOVE YOU, I LOVE YOU",
            "MÃI YÊU EM, MÃI YÊU EM",
            "YÊU CÔNG CHÚA CỦA ANH",
            "I LOVE YOU",
            "MÃI YÊU EM",
            "YÊU EM BÉ CỦA ANH"
        ];

        const textCaches = [];
        
        function preRenderText() {
            phrases.forEach(text => {
                const offCanvas = document.createElement('canvas');
                const offCtx = offCanvas.getContext('2d');
                
                const fontSize = 80;
                offCtx.font = `900 ${fontSize}px "Arial Black", sans-serif`;
                
                const metrics = offCtx.measureText(text);
                const padding = 100; // Không gian rộng để bóng neon không bị cắt xén
                offCanvas.width = metrics.width + padding * 2;
                offCanvas.height = fontSize * 1.5 + padding * 2;

                offCtx.font = `900 ${fontSize}px "Arial Black", sans-serif`;
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';
                
                // Cấu hình hiệu ứng Neon rực rỡ
                offCtx.shadowBlur = 30;
                offCtx.shadowColor = '#ff1493'; // Viền hồng đậm
                offCtx.fillStyle = '#ffb6c1'; // Lõi hồng nhạt
                
                offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2);
                
                textCaches.push({
                    canvas: offCanvas,
                    width: offCanvas.width,
                    height: offCanvas.height
                });
            });
        }
        preRenderText();

        const particles = [];
        const numParticles = 120; 
        const maxDepth = 4000; 
        const focalLength = 400; 

        // Rải đều các hạt trong không gian 3D
        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: (Math.random() - 0.5) * 6000, 
                y: (Math.random() - 0.5) * 6000, 
                z: Math.random() * maxDepth,     
                cache: textCaches[Math.floor(Math.random() * textCaches.length)], 
                speed: Math.random() * 2 + 1.0   // Tốc độ rất chậm rãi và mượt
            });
        }

        // Biến lưu góc xoay camera
        let cameraAngleX = 0;
        let cameraAngleY = 0;
        // Biến đích đến để camera xoay mượt mà (Lerp)
        let targetAngleX = 0;
        let targetAngleY = 0;

        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // Giới hạn góc nhìn để không quay ngược ra sau lưng (khoảng 35 độ)
        const maxAngle = 0.6; 

        function onPointerDown(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            
            // Ẩn dòng chữ hướng dẫn khi bắt đầu vuốt
            document.getElementById('instruction').style.display = 'none';
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const currentX = e.clientX || e.touches[0].clientX;
            const currentY = e.clientY || e.touches[0].clientY;
            
            const dx = currentX - startX;
            const dy = currentY - startY;

            // Chuyển khoảng cách vuốt thành góc xoay
            targetAngleY += dx * 0.002;
            targetAngleX += dy * 0.002;

            // Giới hạn không cho xoay quá xa
            targetAngleY = Math.max(-maxAngle, Math.min(maxAngle, targetAngleY));
            targetAngleX = Math.max(-maxAngle, Math.min(maxAngle, targetAngleX));

            startX = currentX;
            startY = currentY;
        }

        function onPointerUp() {
            isDragging = false;
            // Tự động đưa góc nhìn về trung tâm khi thả tay ra (Có thể comment lại nếu muốn giữ góc nhìn)
            // targetAngleX = 0;
            // targetAngleY = 0;
        }

        // Đăng ký sự kiện chuột và cảm ứng
        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('mouseleave', onPointerUp);

        window.addEventListener('touchstart', onPointerDown, {passive: false});
        window.addEventListener('touchmove', onPointerMove, {passive: false});
        window.addEventListener('touchend', onPointerUp);

        // Hàm Lerp giúp việc xoay camera không bị giật cục
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function animate() {
            ctx.fillStyle = '#050005';
            ctx.fillRect(0, 0, width, height);

            // Cập nhật góc camera mượt mà theo target
            cameraAngleX = lerp(cameraAngleX, targetAngleX, 0.05);
            cameraAngleY = lerp(cameraAngleY, targetAngleY, 0.05);

            // Tính toán trước Sin/Cos của góc Camera để đỡ tính lại nhiều lần
            const cosY = Math.cos(cameraAngleY);
            const sinY = Math.sin(cameraAngleY);
            const cosX = Math.cos(cameraAngleX);
            const sinX = Math.sin(cameraAngleX);

            particles.forEach(p => {
                // Di chuyển chữ về phía người xem theo trục Z thế giới
                p.z -= p.speed;

                if (p.z <= 0) {
                    p.z = maxDepth;
                    p.x = (Math.random() - 0.5) * 6000;
                    p.y = (Math.random() - 0.5) * 6000;
                }

                /* Bước quan trọng: Áp dụng ma trận xoay 3D */
                // Xoay quanh trục Y (Nhìn trái phải)
                let x1 = p.x * cosY - p.z * sinY;
                let z1 = p.z * cosY + p.x * sinY;

                // Xoay quanh trục X (Nhìn lên xuống)
                let y2 = p.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + p.y * sinX;

                // Lưu lại z2 để lát dùng cho thuật toán sắp xếp (Painter's Algorithm)
                p.rotatedZ = z2;
                p.rotatedX = x1;
                p.rotatedY = y2;
            });

            // Sắp xếp lại dựa trên chiều sâu ĐÃ XOAY (Z đã biến đổi theo camera)
            // Chữ ở xa màn hình nhất sẽ vẽ trước, chữ ở gần đè lên sau.
            particles.sort((a, b) => b.rotatedZ - a.rotatedZ);

            particles.forEach(p => {
                // Tránh trường hợp chia cho số âm nếu chữ lọt ra sau lưng camera
                if (p.rotatedZ <= 10) return;

                // Phép chiếu phối cảnh 3D -> 2D
                const scale = focalLength / (focalLength + p.rotatedZ);
                const screenX = p.rotatedX * scale + centerX;
                const screenY = p.rotatedY * scale + centerY;

                // Tính kích thước sau khi chiếu
                const drawWidth = p.cache.width * scale;
                const drawHeight = p.cache.height * scale;

                // Kỹ thuật Culling: Bỏ qua chữ nếu nó nằm ngoài màn hình -> Tiết kiệm FPS
                if (screenX + drawWidth / 2 > 0 && 
                    screenX - drawWidth / 2 < width && 
                    screenY + drawHeight / 2 > 0 && 
                    screenY - drawHeight / 2 < height) {
                    
                    // Xa mờ, gần rõ (Fade in/Fade out)
                    let opacity = (maxDepth - p.rotatedZ) / (maxDepth * 0.6);
                    if (opacity > 1) opacity = 1;
                    if (opacity < 0) opacity = 0;
                    
                    ctx.globalAlpha = opacity;
                    
                    // In ảnh cache (chữ) lên canvas
                    ctx.drawImage(
                        p.cache.canvas, 
                        screenX - drawWidth / 2, 
                        screenY - drawHeight / 2, 
                        drawWidth, 
                        drawHeight
                    );
                }
            });

            requestAnimationFrame(animate);
        }

        // Bắt đầu vòng lặp
        animate();
    </script>
</body>
</html>
